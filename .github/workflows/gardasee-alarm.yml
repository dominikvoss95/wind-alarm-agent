name: Daily Gardasee Wind Alarm Check

# Backup scheduler. EventBridge is primary once Terraform is applied.
# UTC hours 3-9 cover 05:00-10:00 Europe/Berlin in both CET and CEST
# (winter also runs from 04:00, summer also runs until 11:45).
on:
  schedule:
    - cron: '*/15 3-9 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check-wind:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FCM_TOPIC: "wind_alarms_gardasee"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Berlin date
        id: day
        run: |
          mkdir -p .alarm-ledger
          echo "day=$(TZ=Europe/Berlin date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore alarm ledger
        uses: actions/cache/restore@v4
        with:
          path: .alarm-ledger
          key: alarm-ledger-gardasee-${{ steps.day.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            alarm-ledger-gardasee-${{ steps.day.outputs.day }}-

      - name: Create Firebase Service Account Key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > serviceAccountKey.json
          fi

      - name: Run Wind Alarm Agent for Gardasee
        env:
          PYTHONPATH: src
          WIND_ALARM_LEDGER: .alarm-ledger/ledger.json
          WIND_ALARM_SEND: ${{ vars.WIND_ALARM_SEND_FROM_ACTIONS == 'false' && 'false' || 'true' }}
        run: python app.py --location gardasee

      - name: Save alarm ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alarm-ledger
          key: alarm-ledger-gardasee-${{ steps.day.outputs.day }}-${{ github.run_id }}

      - name: Upload run files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gardasee-${{ github.run_id }}
          path: debug
          if-no-files-found: ignore
