name: Verify webcam readings

# Compares the station JSON with the overlay on the current frame.
# Does not send a push. The schedule stays off unless the repository
# variable WIND_READING_VERIFY is set to true. workflow_dispatch always runs.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || vars.WIND_READING_VERIFY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compare station data with the overlay
        run: |
          PYTHONPATH=src python app.py --verify --location kochelsee
          PYTHONPATH=src python app.py --verify --location gardasee
