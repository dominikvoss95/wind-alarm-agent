name: Daily Wind Alarm Check

on:
  schedule:
    # Runs every 15 minutes between 03:00 and 06:00 UTC (05:00 - 08:00 CEST).
    # This covers the typical early morning wind window at Kochelsee.
    - cron: '*/15 3-6 * * *'
  
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check-wind:
    runs-on: ubuntu-latest

    env:
      # Fallback when a run has no per-location topic. Kochelsee alarms use
      # config.LOCATIONS (wind_alarms_kochelsee), which the Flutter app subscribes to.
      FCM_TOPIC: "wind_alarms_kochelsee"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Create Firebase Service Account Key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > serviceAccountKey.json
          fi

      - name: Run Wind Alarm Agent
        run: |
          PYTHONPATH=src python app.py --location kochelsee --threshold 10.0
        env:
          PYTHONPATH: src
